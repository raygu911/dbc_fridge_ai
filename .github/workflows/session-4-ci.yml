name: Session 4 CI

on:
  push:
    branches:
      - dev
      - session-4-production
    paths:
      - "base/session-4-production/**"
      - ".github/workflows/session-4-ci.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "base/session-4-production/**"
      - ".github/workflows/session-4-ci.yml"

permissions:
  contents: read

concurrency:
  group: session-4-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fridge_ai
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: fridge_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fridge_ai -d fridge_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: base/session-4-production

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://fridge_ai:test-password@localhost:5432/fridge_ai_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: base/session-4-production/pyproject.toml

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting and lint
        run: ruff check .

      - name: Run tests
        run: pytest
